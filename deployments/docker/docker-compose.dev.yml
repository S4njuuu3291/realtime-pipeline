# Gunakan bersama docker-compose.yml dan --env-file ../../.env.
services:
  traffic-generator:
    volumes:
      - ../../services/order-service/traffic-config.dev.yaml:/app/traffic-config.yaml:ro
    restart: "no"

  postgres-source:
    ports: !override
      - "${POSTGRES_DEV_PORT:?set POSTGRES_DEV_PORT}:5432"

  order-service:
    ports: !override
      - "${ORDER_SERVICE_DEV_PORT:?set ORDER_SERVICE_DEV_PORT}:8000"

  debezium:
    ports: !override
      - "${DEBEZIUM_DEV_PORT:?set DEBEZIUM_DEV_PORT}:8083"

  redpanda:
    ports: !override
      - "${REDPANDA_DEV_PORT:?set REDPANDA_DEV_PORT}:19092"
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:${REDPANDA_DEV_PORT:?set REDPANDA_DEV_PORT}
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145

  redpanda-console:
    ports: !override
      - "${REDPANDA_CONSOLE_DEV_PORT:?set REDPANDA_CONSOLE_DEV_PORT}:8080"

  clickhouse:
    ports: !override
      - "${CLICKHOUSE_HTTP_PORT:?set CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:?set CLICKHOUSE_NATIVE_PORT}:9000"

  superset:
    ports: !override
      - "${SUPERSET_DEV_PORT:?set SUPERSET_DEV_PORT}:8088"

  prometheus:
    ports: !override
      - "${PROMETHEUS_DEV_PORT:?set PROMETHEUS_DEV_PORT}:9090"

  grafana:
    ports: !override
      - "${GRAFANA_DEV_PORT:?set GRAFANA_DEV_PORT}:3000"

  node-exporter:
    ports: !override
      - "${NODE_EXPORTER_DEV_PORT:?set NODE_EXPORTER_DEV_PORT}:9100"

  postgres-exporter:
    ports: !override
      - "${POSTGRES_EXPORTER_DEV_PORT:?set POSTGRES_EXPORTER_DEV_PORT}:9187"
