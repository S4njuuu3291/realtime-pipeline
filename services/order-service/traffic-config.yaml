# Konfigurasi yang disiapkan untuk refactor traffic generator (ADR-004).
# Generator saat ini belum membaca file ini.

request:
  # Target menghitung request yang dicoba, bukan transaksi yang berhasil.
  base_rate_per_second: 5
  max_concurrency: 50
  timeout_seconds: 5

flash_sale:
  enabled: false
  interval_seconds: 30
  duration_seconds: 2
  # Menggantikan base_rate_per_second selama flash sale.
  rate_per_second: 400

experiment:
  # null berarti berjalan sampai dihentikan secara manual.
  duration_seconds: 30
