name: Data Pipeline CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/consumer/go.mod
          cache-dependency-path: services/consumer/go.sum

      - name: Validate Docker Compose
        run: |
          echo "POSTGRES_USER=dummy" > .env
          echo "POSTGRES_PASSWORD=dummy" >> .env
          echo "POSTGRES_DB=dummy" >> .env
          echo "POSTGRES_HOST=dummy" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          echo "REDPANDA_BROKERS=dummy:9092" >> .env
          echo "SUPERSET_SECRET_KEY=ci-placeholder-secret" >> .env
          echo "CLICKHOUSE_ADMIN_PASSWORD=ci-placeholder" >> .env
          echo "CLICKHOUSE_SUPERSET_PASSWORD=ci-placeholder" >> .env
          echo "GRAFANA_ADMIN_PASSWORD=ci-placeholder" >> .env
          docker compose -f deployments/docker/docker-compose.yml config -q
          echo "Docker Compose valid"

      - name: Validate Superset config
        run: |
          test -f deployments/docker/dashboards/dashboard_export.zip
          echo "Dashboard file exists"

      - name: Validate Makefile commands
        run: |
          make -n init-dbz init-superset seed-db > /dev/null
          bash -n deployments/docker/init-superset.sh
          jq empty services/grafana/dashboards/data-monitoring.json

      - name: Test and vet Go consumer
        working-directory: services/consumer
        run: |
          go test ./...
          go vet ./...
          echo "Go code valid"

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Contabo VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: sanju
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/production/realtime-pipeline

            echo "🔄 Backing up .env..."
            cp -f .env /tmp/realtime-pipeline.env.bak 2>/dev/null || true

            echo "🧹 Cleaning pycache..."
            find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

            echo "📥 Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔐 Restoring .env..."
            cp -f /tmp/realtime-pipeline.env.bak .env 2>/dev/null || true

            echo "✅ Verifying Grafana provisioning..."
            test -f services/grafana/provisioning/datasources/datasource.yml && echo "  ✅ datasource.yml"
            test -f services/grafana/provisioning/dashboards/dashboards.yml && echo "  ✅ dashboards.yml"
            ls services/grafana/dashboards/*.json 2>/dev/null && echo "  ✅ dashboard JSON files found"

            # ── CEK APAKAH FIRST DEPLOY ────────────────────────
            if docker compose --env-file .env -f deployments/docker/docker-compose.yml ps --services --filter "status=running" 2>/dev/null | grep -q .; then
              echo "  ✅ Existing deployment — NON-DESTRUCTIVE UPDATE"
              IS_FIRST_DEPLOY=false
            else
              echo "  🆕 First deployment — FULL SETUP"
              IS_FIRST_DEPLOY=true
            fi

            echo "🏗️ Building images..."
            docker compose --env-file .env -f deployments/docker/docker-compose.yml build --no-cache consumer order-service traffic-generator

            echo "🧹 Unsetting env overrides..."
            unset POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB POSTGRES_HOST POSTGRES_PORT

            if [ "$IS_FIRST_DEPLOY" = true ]; then
              docker compose --env-file .env -f deployments/docker/docker-compose.yml up -d --wait
              make init-db init-dbz init-clickhouse init-superset
              echo "✅ FIRST DEPLOY COMPLETE"
              exit 0
            fi

            # ── NON-DESTRUCTIVE: stop, NOT down! ───────────────
            echo "🛑 Stopping services (containers & networks preserved)..."
            docker compose --env-file .env -f deployments/docker/docker-compose.yml stop
            sleep 5

            echo "🚀 Starting services (recreates containers with new images)..."
            docker compose --env-file .env -f deployments/docker/docker-compose.yml up -d --wait
            sleep 15

            echo "📊 Container status:"
            docker ps --format "table {{.Names}}\t{{.Status}}"

            echo "🔄 Restarting Go consumer (reuses committed offsets)..."
            docker compose --env-file .env -f deployments/docker/docker-compose.yml restart consumer
            sleep 5

            echo "📊 Initializing Superset..."
            sleep 30
            make init-superset 2>/dev/null || echo "Superset init skipped"

            echo ""
            echo "🔍 Health checks..."
            curl -sf http://localhost:8000/docs > /dev/null && echo "  ✅ Order service" || echo "  ⚠️ Order service"
            curl -sf http://localhost:8088 > /dev/null && echo "  ✅ Superset" || echo "  ⚠️ Superset"
            curl -sf http://localhost:9090/-/healthy > /dev/null && echo "  ✅ Prometheus" || echo "  ⚠️ Prometheus"
            curl -sf http://localhost:3000/api/health > /dev/null && echo "  ✅ Grafana" || echo "  ⚠️ Grafana"
            curl -sf http://localhost:9100/metrics > /dev/null && echo "  ✅ Node Exporter" || echo "  ⚠️ Node Exporter"
            docker ps --filter "name=^/consumer$" --format "{{.Names}}\t{{.Status}}" | grep -q "Up" && echo "  ✅ Go consumer" || echo "  ⚠️ Go consumer"

            # Reload provisioning dashboard; gunakan localhost + env/secret, jangan IP publik & kredensial hardcoded
            curl -sf -X POST \
              -u "${GRAFANA_ADMIN_USER:-admin}:${GRAFANA_ADMIN_PASSWORD}" \
              http://localhost:3000/api/admin/provisioning/dashboards/reload || echo "  ⚠️ Grafana reload gagal (non-fatal)"

            echo ""
            echo "✅ NON-DESTRUCTIVE DEPLOYMENT COMPLETE!"
