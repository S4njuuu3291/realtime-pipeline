name: CI/CD Realtime Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # Nilai dummy hanya untuk validasi Compose di runner CI, bukan VPS.
  POSTGRES_USER: ci
  POSTGRES_PASSWORD: ci-placeholder
  POSTGRES_DB: ci
  CLICKHOUSE_ADMIN_PASSWORD: ci-placeholder
  CLICKHOUSE_SUPERSET_PASSWORD: ci-placeholder
  SUPERSET_SECRET_KEY: ci-placeholder
  GRAFANA_ADMIN_PASSWORD: ci-placeholder

jobs:
  test:
    name: Test
    if : github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose -f deployments/docker/docker-compose.yml config -q

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/consumer/go.mod
          cache-dependency-path: services/consumer/go.sum

      - name: Test Go consumer
        working-directory: services/consumer
        run: go test ./...

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install -r services/order-service/requirements.txt

      - name: Test Python generator
        working-directory: services/order-service
        run: python -m unittest discover -v

  build-pr:
    name: Validate Docker build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build images with Docker Compose
        run: docker compose -p realtime-ci -f deployments/docker/docker-compose.yml build consumer order-service superset

  build:
    name: Build and Push Docker
    # VPS menggunakan ARM64; image harus dibangun untuk arsitektur yang sama.
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images with Docker Compose
        run: docker compose -p realtime-ci -f deployments/docker/docker-compose.yml build consumer order-service superset

      - name: Push images to GHCR
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Tag memakai SHA commit agar VPS menarik versi yang tepat.
          for service in consumer order-service superset; do
            repository="${REPOSITORY,,}"
            image="${REGISTRY}/${repository%/*}/${repository##*/}-${service}:${COMMIT_SHA}"
            docker tag "realtime-ci-${service}" "$image"
            docker push "$image"
          done

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    # if event name = push dan branch = main, maka jalankan deploy ke VPS.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Secret SSH dan aturan environment production digunakan oleh job ini.
    environment: production

    steps:
      - name: Checkout deployment config
        uses: actions/checkout@v6

      - name: Deploy files and start services on VPS
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Siapkan SSH dan verifikasi identitas VPS lewat known_hosts.
          test -n "$SERVER_IP" && test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/deploy_key"' EXIT
          ssh_options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10)

          # Kirim file Git dari commit ini ke direktori production terpisah.
          git archive --format=tar.gz -o /tmp/realtime-deployment.tar.gz HEAD
          ssh "${ssh_options[@]}" "ubuntu@$SERVER_IP" "mkdir -p /opt/realtime-pipeline-project/production/$COMMIT_SHA"
          scp "${ssh_options[@]}" /tmp/realtime-deployment.tar.gz "ubuntu@$SERVER_IP:/opt/realtime-pipeline-project/production/$COMMIT_SHA/source.tar.gz"
          ssh "${ssh_options[@]}" "ubuntu@$SERVER_IP" "tar -xzf /opt/realtime-pipeline-project/production/$COMMIT_SHA/source.tar.gz -C /opt/realtime-pipeline-project/production/$COMMIT_SHA"

          # Perintah di bawah berjalan di VPS, bukan di runner GitHub.
          ssh "${ssh_options[@]}" "ubuntu@$SERVER_IP" bash -s -- "$COMMIT_SHA" "${REPOSITORY,,}" <<'REMOTE'
          set -eu
          release_dir="/opt/realtime-pipeline-project/production/$1"
          export IMAGE_TAG="$1"
          repository="$2"
          export IMAGE_PREFIX="ghcr.io/${repository%/*}/${repository##*/}"
          cd "$release_dir"

          # .env produksi disiapkan di VPS dan tidak disalin dari repository.
          test -f /opt/realtime-pipeline-project/.env
          # Tarik image yang sesuai commit, lalu jalankan seluruh service.
          # Nama project tetap menjaga nama volume antar-deploy.
          docker compose --project-name realtime-pipeline \
            --env-file /opt/realtime-pipeline-project/.env \
            -f deployments/docker/docker-compose.yml \
            -f deployments/docker/docker-compose.production.yml \
            pull
          docker compose --project-name realtime-pipeline \
            --env-file /opt/realtime-pipeline-project/.env \
            -f deployments/docker/docker-compose.yml \
            -f deployments/docker/docker-compose.production.yml \
            up -d --no-build

          # Inisialisasi hanya sekali; beberapa langkah menulis data dan dashboard.
          (
            flock -x 9
            if [ -f /opt/realtime-pipeline-project/.initialized ]; then
              echo "Pipeline sudah diinisialisasi; melewati inisialisasi."
            else
              export ENV_FILE=/opt/realtime-pipeline-project/.env
              export DOCKER_COMPOSE="docker compose --project-name realtime-pipeline --env-file $ENV_FILE -f deployments/docker/docker-compose.yml -f deployments/docker/docker-compose.production.yml"
              bash deployments/init-pipeline.sh
              touch /opt/realtime-pipeline-project/.initialized
            fi
          ) 9>/opt/realtime-pipeline-project/.init.lock
          REMOTE
