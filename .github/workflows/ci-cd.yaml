name: CI/CD Realtime Pipeline

on:
  push:
    # Branch ini akan menjalankan test, build, dan deploy jika berhasil.
    branches: [main, develop, feat/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Nilai dummy hanya untuk validasi Compose di runner CI, bukan VPS.
  POSTGRES_USER: ci
  POSTGRES_PASSWORD: ci-placeholder
  POSTGRES_DB: ci
  CLICKHOUSE_ADMIN_PASSWORD: ci-placeholder
  CLICKHOUSE_SUPERSET_PASSWORD: ci-placeholder
  SUPERSET_SECRET_KEY: ci-placeholder
  GRAFANA_ADMIN_PASSWORD: ci-placeholder

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose -f deployments/docker/docker-compose.yml config -q

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/consumer/go.mod
          cache-dependency-path: services/consumer/go.sum

      - name: Test Go consumer
        working-directory: services/consumer
        run: go test ./...

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install -r services/order-service/requirements.txt

      - name: Test Python generator
        working-directory: services/order-service
        run: python -m unittest discover -v

  build:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    needs: test

    # PR hanya menjalankan test; build dan push berjalan setelah push/manual.
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images with Docker Compose
        run: docker compose -p realtime-ci -f deployments/docker/docker-compose.yml build consumer order-service superset

      - name: Push images to GHCR
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Tag memakai SHA commit agar VPS menarik versi yang tepat.
          for service in consumer order-service superset; do
            repository="${REPOSITORY,,}"
            image="${REGISTRY}/${repository%/*}/${repository##*/}-${service}:${COMMIT_SHA}"
            docker tag "realtime-ci-${service}" "$image"
            docker push "$image"
          done

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build

    # Secret SSH dan aturan environment production digunakan oleh job ini.
    environment: production

    steps:
      - name: Checkout deployment config
        uses: actions/checkout@v6

      - name: Stage files and start services on VPS
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Siapkan SSH dan verifikasi identitas VPS lewat known_hosts.
          : "${SERVER_IP:?Secret SERVER_IP belum diatur}"
          : "${SSH_PRIVATE_KEY:?Secret SSH_PRIVATE_KEY belum diatur}"
          : "${SSH_KNOWN_HOSTS:?Secret SSH_KNOWN_HOSTS belum diatur}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/deploy_key"' EXIT
          ssh_options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10)
          # Kirim file Git dari commit ini ke direktori staging terpisah.
          echo "Mengemas file deployment..."
          git archive --format=tar.gz -o /tmp/realtime-deployment.tar.gz HEAD
          echo "Menyiapkan direktori staging di VPS..."
          ssh "${ssh_options[@]}" "ubuntu@$SERVER_IP" "mkdir -p /opt/realtime-pipeline-project/staging/$COMMIT_SHA"
          echo "Mengirim dan mengekstrak file deployment..."
          scp "${ssh_options[@]}" /tmp/realtime-deployment.tar.gz "ubuntu@$SERVER_IP:/opt/realtime-pipeline-project/staging/$COMMIT_SHA/source.tar.gz"
          ssh "${ssh_options[@]}" "ubuntu@$SERVER_IP" "tar -xzf /opt/realtime-pipeline-project/staging/$COMMIT_SHA/source.tar.gz -C /opt/realtime-pipeline-project/staging/$COMMIT_SHA"
          # Perintah di bawah berjalan di VPS, bukan di runner GitHub.
          ssh "${ssh_options[@]}" "ubuntu@$SERVER_IP" bash -s -- "$COMMIT_SHA" "${REPOSITORY,,}" <<'REMOTE'
          set -eu
          release_dir="/opt/realtime-pipeline-project/staging/$1"
          export IMAGE_TAG="$1"
          repository="$2"
          export IMAGE_PREFIX="ghcr.io/${repository%/*}/${repository##*/}"
          cd "$release_dir"
          # .env produksi disiapkan di VPS dan tidak disalin dari repository.
          if [ ! -f /opt/realtime-pipeline-project/.env ]; then
            echo "ERROR: File /opt/realtime-pipeline-project/.env belum ada di VPS." >&2
            exit 1
          fi
          echo "File .env ditemukan. Menarik image..."
          # Tarik image yang sesuai commit, lalu jalankan seluruh service.
          # Nama project tetap menjaga nama volume antar-deploy.
          docker compose --project-name realtime-pipeline \
            --env-file /opt/realtime-pipeline-project/.env \
            -f deployments/docker/docker-compose.yml \
            -f deployments/docker/docker-compose.production.yml \
            pull
          docker compose --project-name realtime-pipeline \
            --env-file /opt/realtime-pipeline-project/.env \
            -f deployments/docker/docker-compose.yml \
            -f deployments/docker/docker-compose.production.yml \
            up -d --no-build
          # Make dan envsubst diperlukan oleh target inisialisasi di VPS.
          if ! command -v make >/dev/null || ! command -v envsubst >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install -y make gettext-base
          fi
          # Make membaca .env dari direktori project; file aslinya tetap di VPS.
          ln -sfn /opt/realtime-pipeline-project/.env .env
          export DOCKER_COMPOSE="docker compose --project-name realtime-pipeline --env-file /opt/realtime-pipeline-project/.env -f deployments/docker/docker-compose.yml -f deployments/docker/docker-compose.production.yml"
          # Seed dan inisialisasi hanya pada deploy pertama yang berhasil.
          if [ ! -f /opt/realtime-pipeline-project/.initialized ]; then
            echo "Menjalankan inisialisasi pertama..."
            bash deployments/init-pipeline.sh
            touch /opt/realtime-pipeline-project/.initialized
          else
            echo "Pipeline sudah diinisialisasi; melewati seed dan setup awal."
          fi
          REMOTE
