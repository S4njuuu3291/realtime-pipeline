name: CI/CD Realtime Pipeline

on:
  push:
  # push semua branch
    branches: 
      - '**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/consumer/go.mod
          cache-dependency-path: services/consumer/go.sum

      - name: Test Go consumer
        working-directory: services/consumer
        run: go test ./...

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install -r services/order-service/requirements.txt

      - name: Test Python generator
        working-directory: services/order-service
        run: python -m unittest discover -v
